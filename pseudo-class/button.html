<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: red;
            color: white;
        }
        button:focus{
            background-color: blue;
            color: white;
        }
        button:active{
            background-color: green;
            color: white;
        }
        a:link{
            text-decoration: none;
            color:black;
        }
        a:visited{
            color:chocolate;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    <br>
    <br>
    <a href="#">Link</a>
</body>
</html>
