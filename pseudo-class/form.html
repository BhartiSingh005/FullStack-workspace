<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:checked{
            box-shadow: 0 0 10px black;
            accent-color: magenta;
        }
        li:nth-child(odd){
            color: black;
            background-color: yellow;
        }
        li:nth-child(even){
            color:aqua;
        }
        li:not(:nth-child(3)){
            background-color: red;
        }
        input{
            border-width: 3px 3px 7px 8px;
            border-color: black;
            display: block;
            margin-top:3%;
            font-size:30px;
        }
        input:required{
            border-color: red;
        }
        input:optional{
            border-color: green;
        }
        input:enabled{
            background-color: pink;
            box-shadow: 0 0 10px black;
        }
        input:disabled{
            background-color: gray;
            box-shadow: 0 0 10px black;
        }
        input:valid{
            background-color: lightgreen;
            box-shadow: 0 0 10px black;
        }
        input:invalid{
            background-color: lightcoral;
            box-shadow: 0 0 10px black;
        }
        input:in-range{
            background-color: lightblue;
            box-shadow: 0 0 10px black;
        }
        input:out-of-range{
            background-color: lightpink;
            box-shadow: 0 0 10px black;
        }
        input:read-only{
            border-width:0px;
            box-shadow: 0 0 0;
            background-color: lightgrey;

        }
    </style>
</head>
<body>
    <input type="checkbox" >
    <input type="checkbox" >
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
        <li>8</li>
        <li>9</li>
    </ul>
    <input type="text" placeholder="First Name" required>
    <input type="text" placeholder="Middle Name" >
    <input type="text" placeholder="Last Name" required>
    <input type="text" placeholder="Address" value="Agra" disabled>
    <input type="email" placeholder="Email">
    <input type="number" min="10" max="100" placeholder="Age">
    <input type="text" value="Mr." readonly>
</body>
</html>
